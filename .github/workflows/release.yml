name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.python-version || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # -------------------------
          # Linux (single job builds all versions)
          # -------------------------
          - os: ubuntu-latest
            python-version: ""

          # -------------------------
          # Windows (matrix per Python version)
          # -------------------------
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Linux (manylinux wheels)
      # -------------------------
      - name: Build wheels (Linux x86_64)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python3.8 -i python3.9 -i python3.10 -i python3.11 -i python3.12
          manylinux: auto

      - name: Build wheels (Linux aarch64)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python3.8 -i python3.9 -i python3.10 -i python3.11 -i python3.12
          manylinux: auto
          target: aarch64-unknown-linux-gnu

      # -------------------------
      # Windows (per Python version)
      # -------------------------
      - name: Set up Python (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels (Windows)
        if: matrix.os == 'windows-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      # -------------------------
      # Upload artifacts
      # -------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version || 'linux' }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1